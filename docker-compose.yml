services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      POSTGRES_DB: cmp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
    command: uvicorn cmp.app:app --host 0.0.0.0 --port 8000
volumes:
  pgdata:
