<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CMP — batch {{ batch_date }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; color: #1a1a1a; }

    button { padding: 4px 10px; }
  </style>
</head>

    </tbody>
  </table>
</body>
</html>
